services:
  api:
    build:
      context: ./api
    restart: unless-stopped
    environment:
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-9000}
      DATABASE_URL: ${DATABASE_URL}
      AUTH0_ISSUER: ${AUTH0_ISSUER}
      AUTH0_API_AUDIENCE: ${AUTH0_API_AUDIENCE}
      AUTH0_MANAGEMENT_AUDIENCE: ${AUTH0_MANAGEMENT_AUDIENCE}
      AUTH0_MANAGEMENT_CLIENT_ID: ${AUTH0_MANAGEMENT_CLIENT_ID}
      AUTH0_MANAGEMENT_CLIENT_SECRET: ${AUTH0_MANAGEMENT_CLIENT_SECRET}
    networks:
      - default
      - dokploy-network

  client:
    build:
      context: ./client
      args:
        VITE_AUTH_AUTHORITY: ${VITE_AUTH_AUTHORITY}
        VITE_AUTH_CLIENT_ID: ${VITE_AUTH_CLIENT_ID}
        VITE_AUTH_SCOPE: ${VITE_AUTH_SCOPE:-openid profile email}
        VITE_AUTH_AUDIENCE: ${VITE_AUTH_AUDIENCE}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: http://api:9000

networks:
  dokploy-network:
    external: true
